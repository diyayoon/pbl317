# Versi PORTAINER: memakai image yang sudah dibuild di webserver (tanpa 'build:').
# Build image dulu di webserver:
#   docker build -t albis-web:latest .
#   docker build -t albis-nginx:latest ./nginx
# Albis Antique: Nginx -> Flask/Gunicorn -> PostgreSQL (database `albis_db`, di luar stack ini).
# Untuk PostgreSQL lokal dalam Docker, tambahkan -f docker-compose.local.yml.
services:
  web:
    image: albis-web:latest
    pull_policy: never
    environment:
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?Isi SECRET_KEY di environment Portainer atau file .env}
      DATABASE_URL: ${DATABASE_URL:-}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      # 1 = cookie hanya lewat HTTPS (wajib saat diakses lewat domain HTTPS).
      # Isi 0 HANYA untuk uji internal lewat http://IP:PORT.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
      ORDER_PAYMENT_TTL_JAM: ${ORDER_PAYMENT_TTL_JAM:-24}
      MAX_OPEN_ORDERS: ${MAX_OPEN_ORDERS:-5}
      PAYMENT_BANK_NAME: ${PAYMENT_BANK_NAME:-}
      PAYMENT_BANK_ACCOUNT: ${PAYMENT_BANK_ACCOUNT:-}
      PAYMENT_BANK_HOLDER: ${PAYMENT_BANK_HOLDER:-}
      PAYMENT_QRIS_NOTE: ${PAYMENT_QRIS_NOTE:-}
      # Tautan email & verifikasi (APP_BASE_URL wajib saat APP_ENV=production)
      APP_BASE_URL: ${APP_BASE_URL:-}
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SECURITY: ${MAIL_SECURITY:-starttls}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      EMAIL_VERIFY_TTL_JAM: ${EMAIL_VERIFY_TTL_JAM:-24}
      EMAIL_VERIFY_COOLDOWN_DETIK: ${EMAIL_VERIFY_COOLDOWN_DETIK:-60}
      EMAIL_VERIFY_MAX_PER_JAM: ${EMAIL_VERIFY_MAX_PER_JAM:-5}
      EMAIL_VERIFY_KODE_DIGIT: ${EMAIL_VERIFY_KODE_DIGIT:-6}
      EMAIL_VERIFY_KODE_MAX_SALAH: ${EMAIL_VERIFY_KODE_MAX_SALAH:-5}
      # Ongkir tarif tetap (rupiah) dan kedaluwarsa pesanan berkala (detik)
      SHIPPING_COST_FLAT: ${SHIPPING_COST_FLAT:-25000}
      SHIPPING_FREE_ABOVE: ${SHIPPING_FREE_ABOVE:-0}
      ORDER_EXPIRE_INTERVAL_DETIK: ${ORDER_EXPIRE_INTERVAL_DETIK:-60}
      # Timeout inaktivitas sesi (menit)
      SESI_INAKTIF_MENIT_CUSTOMER: ${SESI_INAKTIF_MENIT_CUSTOMER:-20}
      SESI_INAKTIF_MENIT_ADMIN: ${SESI_INAKTIF_MENIT_ADMIN:-20}
      # Midtrans (kosongkan MIDTRANS_SERVER_KEY untuk menonaktifkan)
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-0}
    volumes:
      - instance_data:/app/instance
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # /health tidak menyentuh database, jadi web tetap "healthy" saat DB belum dimigrasi.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - app_net

  nginx:
    image: albis-nginx:latest
    pull_policy: never
    ports:
      # Hanya bisa diakses dari server itu sendiri. Traffic publik lewat BunkerWeb.
      - "127.0.0.1:${APP_HTTP_PORT:-8081}:80"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      app_net: {}
      bw-services:
        aliases:
          - ecommerce-nginx

  # Alat sekali jalan (tidak ikut start otomatis): migrasi skema dengan role OWNER database.
  #   docker compose --profile tools run --rm migrate
  migrate:
    profiles: ["tools"]
    image: albis-web:latest
    pull_policy: never
    command: ["python", "-m", "flask", "--app", "run", "db", "upgrade"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?Isi SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL:-}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Isi MIGRATION_DATABASE_URL (role owner skema)}
    networks:
      - app_net

volumes:
  instance_data:

networks:
  app_net:
    driver: bridge
  bw-services:
    external: true