<aside id="customerWorkspaceSidebar" class="dashboard-sidebar customer-sidebar workspace-sidebar">
    <div class="customer-sidebar-brand">
        <span class="customer-sidebar-crest" aria-hidden="true">♕</span>
        <span>AKUN SAYA</span>
        <small>Ruang pribadi kolektor</small>
    </div>

    <nav aria-label="Menu akun pelanggan">
        <a href="{{ url_for('main.katalog') }}">
            <span aria-hidden="true">⌕</span> Jelajahi katalog
        </a>
        <a
            class="{% if request.endpoint == 'customer.dashboard' %}active{% endif %}"
            href="{{ url_for('customer.dashboard') }}"
        >
            <span aria-hidden="true">⌂</span> Ringkasan
        </a>
        <a
            class="{% if request.endpoint == 'customer.pesanan' %}active{% endif %}"
            href="{{ url_for('customer.pesanan') }}"
        >
            <span aria-hidden="true">♧</span> Pesanan
        </a>
        <a
            class="{% if request.endpoint == 'customer.keranjang' %}active{% endif %}"
            href="{{ url_for('customer.keranjang') }}"
        >
            <span aria-hidden="true">♙</span> Keranjang
        </a>
        <a
            class="{% if request.endpoint == 'customer.profil' %}active{% endif %}"
            href="{{ url_for('customer.profil') }}"
        >
            <span aria-hidden="true">♔</span> Profil
        </a>
        <a
            class="{% if request.endpoint == 'customer.keamanan' %}active{% endif %}"
            href="{{ url_for('customer.keamanan') }}"
        >
            <span aria-hidden="true">♧</span> Keamanan
        </a>

        <form class="workspace-logout-form" action="{{ url_for('auth.logout') }}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="workspace-logout-link" type="submit">
                <span aria-hidden="true">↪</span> Keluar dari akun
            </button>
        </form>
    </nav>
</aside>
