<aside id="adminWorkspaceSidebar" class="dashboard-sidebar admin-sidebar">
    <div class="admin-sidebar-heading">
        <span aria-hidden="true">♕</span>
        <div>
            <strong>ALBIS ADMIN</strong>
            <small>Ruang kerja admin</small>
        </div>
    </div>

    <nav aria-label="Menu admin">
        <a href="{{ url_for('main.katalog') }}" target="_blank" rel="noopener noreferrer">
            <span aria-hidden="true">↗</span> Lihat toko <small>Tab baru</small>
        </a>
        <a
            class="{% if request.endpoint == 'admin.dashboard' %}active{% endif %}"
            href="{{ url_for('admin.dashboard') }}"
        >
            <span aria-hidden="true">▦</span> Dashboard
        </a>
        <a
            class="{% if request.endpoint == 'admin.produk' %}active{% endif %}"
            href="{{ url_for('admin.produk') }}"
        >
            <span aria-hidden="true">◇</span> Produk
        </a>
        <a
            class="{% if request.endpoint == 'admin.kategori' %}active{% endif %}"
            href="{{ url_for('admin.kategori') }}"
        >
            <span aria-hidden="true">▣</span> Kategori
        </a>
        <a
            class="{% if request.endpoint == 'admin.pengguna' %}active{% endif %}"
            href="{{ url_for('admin.pengguna') }}"
        >
            <span aria-hidden="true">♙</span> Pengguna
        </a>
        <a
            class="{% if request.endpoint in ['admin.pesanan', 'admin.pembayaran'] %}active{% endif %}"
            href="{{ url_for('admin.pesanan') }}"
        >
            <span aria-hidden="true">▤</span> Pesanan &amp; Pembayaran
        </a>
        <a
            class="{% if request.endpoint == 'admin.ulasan' %}active{% endif %}"
            href="{{ url_for('admin.ulasan') }}"
        >
            <span aria-hidden="true">★</span> Ulasan
        </a>
        <a
            class="{% if request.endpoint == 'admin.audit_log' %}active{% endif %}"
            href="{{ url_for('admin.audit_log') }}"
        >
            <span aria-hidden="true">⌕</span> Audit log
        </a>
        <a
            class="{% if request.endpoint == 'admin.akun' %}active{% endif %}"
            href="{{ url_for('admin.akun') }}"
        >
            <span aria-hidden="true">⚙</span> Akun &amp; keamanan
        </a>

        <form class="workspace-logout-form" action="{{ url_for('auth.logout') }}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="workspace-logout-link" type="submit">
                <img class="ui-icon workspace-action-icon" src="{{ url_for('static', filename='images/icons/logout.svg') }}" alt="" aria-hidden="true"> Keluar dari akun
            </button>
        </form>
    </nav>

    <div class="admin-sidebar-note">
        Masuk sebagai<br>
        <span>{{ current_user.nama }}</span>
    </div>
</aside>
