name: Albis Antique CI

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # PostgreSQL 16 untuk pengujian migration.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: albis_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d albis_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: development
      SECRET_KEY: ci-only-not-for-deployment
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/albis_db
      MIGRATION_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/albis_db
      APP_BASE_URL: http://localhost:5000

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Audit Python Dependencies
        run: |
          pip-audit

      - name: Check Python Syntax
        run: |
          python -m compileall -q app tests run.py

      # Validasi migration menggunakan PostgreSQL 16.
      - name: Validate PostgreSQL Migration Heads
        run: |
          python -m flask --app run:app db heads

      - name: Upgrade PostgreSQL Migrations
        run: |
          python -m flask --app run:app db upgrade
          python -m flask --app run:app db current

      - name: Test PostgreSQL Migration Downgrade
        run: |
          python -m flask --app run:app db downgrade -1

      - name: Test PostgreSQL Migration Re-Upgrade
        run: |
          python -m flask --app run:app db upgrade
          python -m flask --app run:app db current

      - name: Run Automated Tests
        run: |
          pytest -v

      - name: Validate Docker Compose
        run: |
          docker compose -f docker-compose.yml config --quiet

      - name: Validate Portainer Compose
        run: |
          docker compose -f docker_compose.portainer.yml config --quiet

      - name: Build Flask Docker Image
        run: |
          docker build --pull -t albis-web:ci .

      - name: Build Nginx Docker Image
        run: |
          docker build --pull -t albis-nginx:ci ./nginx
