
name: Albis Antique CI

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      APP_ENV: development
      SECRET_KEY: ci-only-not-for-deployment
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/albis_db
      MIGRATION_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/albis_db
      APP_BASE_URL: http://localhost:5000

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Check Python Syntax
        run: |
          python -m compileall -q app tests run.py

      - name: Run Automated Tests
        run: |
          pytest -v

      - name: Validate Docker Compose
        run: |
          docker compose -f docker-compose.yml config --quiet

      - name: Validate Portainer Compose
        run: |
          docker compose -f docker_compose.portainer.yml config --quiet

      - name: Build Flask Docker Image
        run: |
          docker build --pull -t albis-web:ci .

      - name: Build Nginx Docker Image
        run: |
          docker build --pull -t albis-nginx:ci ./nginx
