# Reverse proxy: nginx menerima trafik di port 80 (dipetakan ke 8080 di server)
# lalu meneruskannya ke aplikasi Flask (gunicorn) pada service "web" port 5000.
server {
    listen 80;
    server_name _;

    # Upload foto produk maksimal 5 MB (MAX_CONTENT_LENGTH di app/config.py); sisakan sedikit ruang untuk bagian form lain.
    client_max_body_size 6m;

    # DNS internal Docker. Nama "web" diterjemahkan saat ada permintaan (bukan saat nginx start),
    # jadi nginx tetap hidup walau container web dimulai ulang dan IP-nya berubah.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $hulu http://web:5000;
        proxy_pass $hulu;

        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
