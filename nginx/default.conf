# Reverse proxy Albis Antique: nginx (port 80) -> Flask/gunicorn (web:5000).
# Lapisan ini menambah: pembatasan laju (anti brute-force/flood), header proto/IP yang benar
# di belakang Cloudflare Tunnel, dan penyembunyian versi server.

# IP klien: pakai CF-Connecting-IP bila ada (Cloudflare Tunnel), kalau tidak alamat langsung.
map $http_cf_connecting_ip $klien {
    default $remote_addr;
    "~."    $http_cf_connecting_ip;
}
# Skema asli: HTTPS dari Cloudflare diteruskan agar cookie Secure & HSTS bekerja.
map $http_x_forwarded_proto $skema_asli {
    default $scheme;
    https   https;
}

limit_req_zone $klien zone=umum:10m  rate=20r/s;
limit_req_zone $klien zone=masuk:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 6m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # File tersembunyi tidak pernah dilayani.
    location ~ /\.(?!well-known) { deny all; return 404; }

    # Login & registrasi: batas ketat per IP (lapisan kedua setelah batas per-akun di Flask).
    location ~ ^/auth/(login|register)$ {
        limit_req zone=masuk burst=10 nodelay;
        set $hulu http://web:5000;
        proxy_pass $hulu;
        include /etc/nginx/proxy_params.conf;
    }

    location / {
        limit_req zone=umum burst=60 nodelay;
        set $hulu http://web:5000;
        proxy_pass $hulu;
        include /etc/nginx/proxy_params.conf;
    }
}
