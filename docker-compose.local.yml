# Override opsional: PostgreSQL lokal dalam Docker (database albis_db).
# Jalankan:  docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# Role `albis_app` di sini adalah pemilik database sekaligus, jadi MIGRATION_DATABASE_URL
# boleh sama dengan DATABASE_URL. Untuk produksi pisahkan role owner dan role runtime.
services:
  web:
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-albis_app}:${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di .env}@db:5432/${POSTGRES_DB:-albis_db}
    depends_on:
      db:
        condition: service_healthy

  migrate:
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-albis_app}:${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di .env}@db:5432/${POSTGRES_DB:-albis_db}
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-albis_app}:${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di .env}@db:5432/${POSTGRES_DB:-albis_db}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-albis_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di .env}
      POSTGRES_DB: ${POSTGRES_DB:-albis_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - app_net
    # Port PostgreSQL sengaja TIDAK dipetakan ke host.

volumes:
  db_data:
